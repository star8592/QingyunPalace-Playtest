function install(obj,id,source){
 const a=anchors[id];if(!a)throw Error('missing real rock anchor '+id);

 if(bb.isEmpty())throw Error('empty building '+id);

 const ratio=a.width/max;
 holder.scale.setScalar(ratio);

for(const id of ['01','03']){

const detailMesh=rocks.children[0];

function view(kind){
 const a=anchors['03'];const target=new THREE.Vector3(a.x,a.height*.5,a.z);
 currentCamera=ortho;controls.object=ortho;
